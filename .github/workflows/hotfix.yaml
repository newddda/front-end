name: Show Squashed Merge Commit on PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: write
  issues: write
  actions: write

jobs:
  show-squash-commit:
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Get the merge commit if PR is merged
            let mergeCommitSha = null;
            if (pr.data.merged_at) {
              mergeCommitSha = pr.data.merge_commit_sha;
            }
            
            return JSON.stringify({
              base: pr.data.base.ref,
              head: pr.data.head.ref,
              title: pr.data.title,
              body: pr.data.body,
              mergeCommitSha: mergeCommitSha,
              isMerged: !!pr.data.merged_at
            })

      - name: Find actual patch branch
        id: patch
        run: |
          BRANCHES=$(git ls-remote --heads origin "patch/v*" | awk '{print $2}' | sed 's|refs/heads/||')

          # Filter only patch branches with vX.Y pattern (no extra dots)
          VALID_BRANCHES=$(echo "$BRANCHES" | grep -E '^patch/v[0-9]+\.[0-9]+$')

          if [ -z "$VALID_BRANCHES" ]; then
            echo "❌ No valid patch branches found (must match patch/vX.Y)"
            exit 1
          fi

          echo "Found valid branches:"
          echo "$VALID_BRANCHES"

          # Sort branches by version (vX.Y) and get the latest
          LATEST=$(echo "$VALID_BRANCHES" | sort -t'v' -k2 -V | tail -n 1)

          echo "Latest patch branch: $LATEST"
          echo "latest_patch_branch=$LATEST" >> $GITHUB_OUTPUT

      - name: Create squash merge commit
        id: squash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          pr_info='${{ steps.pr.outputs.result }}'

          # Parse the JSON string first, then extract fields
          parsed_json=$(echo "$pr_info" | jq -r '.')

          base=$(echo "$parsed_json" | jq -r '.base')
          head=$(echo "$parsed_json" | jq -r '.head')
          title=$(echo "$parsed_json" | jq -r '.title')
          body=$(echo "$parsed_json" | jq -r '.body')
          mergeCommitSha=$(echo "$parsed_json" | jq -r '.mergeCommitSha')
          isMerged=$(echo "$parsed_json" | jq -r '.isMerged')

          # Need to check if the PR is merged ------ HEEEREEEE -------
            
          echo "base: $base"
          echo "head: $head"
          echo "title: $title"
          echo "body: $body"
          echo "isMerged: $isMerged"
          echo "mergeCommitSha: $mergeCommitSha"

          git fetch --unshallow origin main
          git checkout $base
          
          # Create new branch from patch branch
          echo "Creating new branch from patch branch..."
          
          timestamp=$(date +%Y%m%d%H%M%S)

          latest_patch_branch=${{ steps.patch.outputs.latest_patch_branch }}
          hotfix_branch="${latest_patch_branch}_${timestamp}"

          git fetch origin $latest_patch_branch:$latest_patch_branch
          git checkout $latest_patch_branch

          pre_hotfix_branch="${hotfix_branch}_prev"
          next_hotfix_branch="${hotfix_branch}_next"

          is_cherry_pick_success=false

          echo "1"

          git checkout -b $pre_hotfix_branch
          if git cherry-pick "$mergeCommitSha"; then
            is_cherry_pick_success=true
          else
            echo "2"

            git checkout --ours .
            echo "3"

            git add .
            echo "4"

            git cherry-pick --continue
            echo "5"
            git push origin $pre_hotfix_branch
          fi

          echo "6"

          git checkout $latest_patch_branch

          git checkout -b $next_hotfix_branch
          if git cherry-pick "$mergeCommitSha"; then
          else
            git checkout --theirs .
            git add .
            git cherry-pick --continue
            git push origin $next_hotfix_branch
          fi

          if git cherry-pick "$mergeCommitSha"; then
            is_cherry_pick_success=true
            echo "✅ Cherry-pick succeeded. Pushing..."
          else
            echo "❌ Conflict detected. Aborting cherry-pick..."
            # git cherry-pick --abort
            git add .
            git commit -m "We have conflicts when cherry-picking the commit: $mergeCommitSha"
          fi

          # git cherry-pick "$mergeCommitSha" || true

          if is_cherry_pick_success; then
            echo "✅ Cherry-pick succeeded. Pushing..."
          else
            echo "❌ Conflict detected. Aborting cherry-pick..."
          fi

          git push origin $hotfix_branch
          
          echo "hotfix_branch=$hotfix_branch" >> $GITHUB_OUTPUT
          echo "is_cherry_pick_success=$is_cherry_pick_success" >> $GITHUB_OUTPUT
          echo "mergeCommitSha=$mergeCommitSha" >> $GITHUB_OUTPUT
          echo "pre_hotfix_branch=$pre_hotfix_branch" >> $GITHUB_OUTPUT
          echo "next_hotfix_branch=$next_hotfix_branch" >> $GITHUB_OUTPUT

      - name: Create PR
        uses: actions/github-script@v7
        with:
          script: |
            const preHotfixBranch = "${{ steps.squash.outputs.pre_hotfix_branch }}";
            const nextHotfixBranch = "${{ steps.squash.outputs.next_hotfix_branch }}";

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New branch from ${{ steps.patch.outputs.latest_patch_branch }}`,

              head: nextHotfixBranch,
              base: latestPatchBranch,
              body: 'This PR was created automatically from the patch branch',
              labels: ['deploy-hotfix']
            });

            # const isCherryPickSuccess = "${{ steps.squash.outputs.is_cherry_pick_success }}" === "true";
            # const mergeCommitSha = "${{ steps.squash.outputs.mergeCommitSha }}";

            # const title = `New branch from ${{ steps.patch.outputs.latest_patch_branch }}`;
            # const head = "${{ steps.squash.outputs.hotfix_branch }}";
            # const base = "${{ steps.patch.outputs.latest_patch_branch }}";
            # const labels = isCherryPickSuccess ? ['deploy-hotfix'] : ['deploy-hotfix', 'deploy-conflict'];

            # const body = isCherryPickSuccess ? 
            #   'This PR was created automatically from the patch branch' : 
            #   `This PR was created automatically from the patch branch, but there were conflicts when cherry-picking the commit: ${mergeCommitSha}`;

            # const pr = await github.rest.pulls.create({
            #   owner: context.repo.owner,
            #   repo: context.repo.repo,
            #   title,
            #   head,
            #   base,
            #   body,
            #   labels
            # });
  
      - name: Show squashed commit
        run: |
          git show ${{ steps.squash.outputs.commit_sha }}

