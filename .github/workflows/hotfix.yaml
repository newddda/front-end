name: Show Squashed Merge Commit on PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: write
  issues: write
  actions: write

jobs:
  show-squash-commit:
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Comment Action Run Link on Original PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔗 **View Action Run:** [Click Here](${runUrl})`
            });

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Get the merge commit if PR is merged
            let mergeCommitSha = null;
            if (pr.data.merged_at) {
              mergeCommitSha = pr.data.merge_commit_sha;
            }
            
            return JSON.stringify({
              base: pr.data.base.ref,
              head: pr.data.head.ref,
              title: pr.data.title,
              body: pr.data.body,
              mergeCommitSha: mergeCommitSha,
              isMerged: !!pr.data.merged_at
            })

      - name: Find actual patch branch
        id: patch
        run: |
          BRANCHES=$(git ls-remote --heads origin "patch/v*" | awk '{print $2}' | sed 's|refs/heads/||')

          # Filter only patch branches with vX.Y pattern (no extra dots)
          VALID_BRANCHES=$(echo "$BRANCHES" | grep -E '^patch/v[0-9]+\.[0-9]+$')

          if [ -z "$VALID_BRANCHES" ]; then
            echo "❌ No valid patch branches found (must match patch/vX.Y)"
            exit 1
          fi

          echo "Found valid branches:"
          echo "$VALID_BRANCHES"

          # Sort branches by version (vX.Y) and get the latest
          LATEST=$(echo "$VALID_BRANCHES" | sort -t'v' -k2 -V | tail -n 1)

          echo "Latest patch branch: $LATEST"
          echo "latest_patch_branch=$LATEST" >> $GITHUB_OUTPUT

      - name: Create squash merge commit
        id: squash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          pr_info='${{ steps.pr.outputs.result }}'

          # Parse the JSON string first, then extract fields
          parsed_json=$(echo "$pr_info" | jq -r '.')

          base=$(echo "$parsed_json" | jq -r '.base')
          head=$(echo "$parsed_json" | jq -r '.head')
          title=$(echo "$parsed_json" | jq -r '.title')
          body=$(echo "$parsed_json" | jq -r '.body')
          mergeCommitSha=$(echo "$parsed_json" | jq -r '.mergeCommitSha')
          isMerged=$(echo "$parsed_json" | jq -r '.isMerged')

          # Need to check if the PR is merged ------ HEEEREEEE -------
            
          echo "base: $base"
          echo "head: $head"
          echo "title: $title"
          echo "body: $body"
          echo "isMerged: $isMerged"
          echo "mergeCommitSha: $mergeCommitSha"

          git fetch --unshallow origin main
          git checkout $base
          
          # Create new branch from patch branch
          echo "Creating new branch from patch branch..."
          
          timestamp=$(date +%Y%m%d%H%M%S)

          latest_patch_branch=${{ steps.patch.outputs.latest_patch_branch }}
          hotfix_branch="${latest_patch_branch}_${timestamp}"

          git fetch origin $latest_patch_branch:$latest_patch_branch
          git checkout $latest_patch_branch

          git checkout -b $hotfix_branch

          is_cherry_pick_success=false

          if git cherry-pick "$mergeCommitSha"; then
            is_cherry_pick_success=true
          else
            git cherry-pick --abort
            git commit --allow-empty -m "We have conflicts when cherry-picking the commit: $mergeCommitSha"
          fi

          git push origin $hotfix_branch
          
          echo "hotfix_branch=$hotfix_branch" >> $GITHUB_OUTPUT
          echo "is_cherry_pick_success=$is_cherry_pick_success" >> $GITHUB_OUTPUT
          echo "merge_commit_sha=$mergeCommitSha" >> $GITHUB_OUTPUT
          echo "latest_patch_branch=${{ steps.patch.outputs.latest_patch_branch }}" >> $GITHUB_OUTPUT

      - name: Create PR
        id: new_pr
        uses: actions/github-script@v7
        with:
          script: |
            const isCherryPickSuccess = "${{ steps.squash.outputs.is_cherry_pick_success }}" === "true";
            const mergeCommitSha = "${{ steps.squash.outputs.merge_commit_sha }}";
            const hotfixBranch = "${{ steps.squash.outputs.hotfix_branch }}";
            const latestPatchBranch = "${{ steps.patch.outputs.latest_patch_branch }}";

            const sc1 = `
            \`\`\`bash
            git fetch origin $hotfixBranch:$hotfixBranch
            git checkout ${hotfixBranch}
            git cherry-pick ${mergeCommitSha}
            \`\`\`
            `;

            const sc2 = `
            \`\`\`bash
            # Resolve conflicts manually in your editor
            \`\`\`
            `;

            const sc3 = `
            \`\`\`bash
            git add .
            git cherry-pick --continue
            git push
            \`\`\`
            `;
            const title = isCherryPickSuccess ?
              `New branch from ${{ steps.patch.outputs.latest_patch_branch }}` :
              `New branch from ${{ steps.patch.outputs.latest_patch_branch }} (with conflicts)`;

            const labels = isCherryPickSuccess ? ['deploy-hotfix'] : ['deploy-hotfix', 'deploy-conflict'];

            const body = isCherryPickSuccess ? 
              'This PR was created automatically from the patch branch' : 
              `## Conflicts when cherry pick: ${mergeCommitSha} ## \n\n\n${sc1} \n${sc2} \n${sc3}`;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: hotfixBranch,
              base: latestPatchBranch,
              body,
              labels
            });
          
            return {
              new_pr_url: pr.data.html_url,
            };
  
      - name: Show squashed commit
        run: |
          git show ${{ steps.squash.outputs.commit_sha }}

      - name: Comment with new PR link
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse('${{ steps.new_pr.outputs.resul }}');
            const newPrUrl = result.new_pr_url;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `A new hotfix PR has been created: [${newPrUrl}](${newPrUrl})`
            });

  notify_on_failure:
    needs: show-squash-commit
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Workflow failed. See details: [Action Run](${runUrl})`
            });