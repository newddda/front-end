name: Update front-end.json and create PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version tag (e.g., v0.696.5)'
        required: true
        type: string

jobs:
  update-pr:
    runs-on: ubuntu-latest
    env:
      FILE_PATH: front-end.json
      TARGET_REPO: newddda/deploy
      VERSION: ${{ github.event.inputs.version }}
      BRANCH_NAME: deploy-${{ github.event.inputs.version }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.DEPLOY_GH_TOKEN }} # You must store a PAT with write access in target repo
          ref: main

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and switch to new branch
        run: |
          git checkout -b $BRANCH_NAME

      - name: Debug file listing
        run: ls -al

      - name: Update front-end.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          jq --arg v "$VERSION" '.stage = $v | .prod = $v' $FILE_PATH > tmp.json && mv tmp.json $FILE_PATH

      - name: Commit and push changes
        run: |
          git add $FILE_PATH
          git commit -m "chore: update front-end.json to $VERSION"
          git push origin $BRANCH_NAME

      - name: Create PR in deploy repo
        uses: actions/github-script@v7
        env:
          DEPLOY_GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
        with:
          github-token: ${{ secrets.DEPLOY_GH_TOKEN }}
          script: |
            const version = "${{ github.event.inputs.version }}";
            const branchName = `update-frontend-json-${version}`;
            const owner = 'newddda';
            const repo = 'deploy';

            const title = `Update front-end.json to ${version}`;
            const body = `This PR updates front-end.json with version ${version}.`;
            const base = 'main';
            const head = branchName;

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body,
            });

            core.setOutput("pr_url", pr.data.html_url);
