name: Block Merge on "no-deploy" Label

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check for "deploy-conflict" label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (labels.includes('deploy-conflict')) {
              core.setFailed('Merge blocked: PR contains "deploy-conflict" label.');
            } else {
              core.info('PR does not contain "deploy-conflict" label. OK to merge.');
            }