name: Create Latest Tag on Hotfix Deploy !!!

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write
  contents: write
  issues: write
  actions: write

jobs:
  tag-latest-on-hotfix:
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'deploy-hotfix')
    runs-on: ubuntu-latest
    env:
      FILE_PATH: front-end.json
      TARGET_REPO: newddda/deploy
      BRANCH_NAME_PREFIX: deploy-
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Get merged branch and find latest tag
        id: find-latest-tag
        run: |
          echo "Getting merged patch branch..."
          
          # Get the merged patch branch from the PR
          MERGED_PATCH_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "Merged patch branch: $MERGED_PATCH_BRANCH"
          
          # Extract version prefix from the merged patch branch
          prefix=$(echo $MERGED_PATCH_BRANCH | cut -d'/' -f2)
          echo "Version prefix: $prefix"
          
          git fetch origin --tags
          current_version=$(git tag --merged HEAD | grep "^${prefix}\." | sort -V | tail -n1)
          
          echo "Current version: $current_version"
          
          if [[ -z "$current_version" ]]; then
            echo "No existing version found, starting with .1"
            new_version="${prefix}.1"
          else
            # Extract version numbers
            major=$(echo $current_version | cut -d'.' -f1 | tr -d 'v')
            minor=$(echo $current_version | cut -d'.' -f2)
            patch=$(echo $current_version | cut -d'.' -f3)

            echo "major: $major"
            echo "minor: $minor"
            echo "patch: $patch"

            new_patch=$((patch + 1))
            new_version="v${major}.${minor}.${new_patch}"
          fi
          
          echo "new_version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          
          # Try to create the new tag
          if git tag $new_version; then
            echo "Successfully created tag: $new_version"
            echo "tag_created=true" >> $GITHUB_OUTPUT
          else
            echo "Failed to create tag: $new_version"
            echo "tag_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Push new tag
        if: steps.find-latest-tag.outputs.tag_created == 'true'
        run: |
          NEW_VERSION="${{ steps.find-latest-tag.outputs.new_version }}"
          git push origin $NEW_VERSION
          
          # Update latest tag
          git tag -f latest $NEW_VERSION
          git push origin latest --force

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.DEPLOY_GH_TOKEN }} # You must store a PAT with write access in target repo
          ref: main

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and switch to new branch
        run: |
          BRANCH_NAME="${{ env.BRANCH_NAME_PREFIX }}${{ steps.find-latest-tag.outputs.new_version }}"
          git checkout -b $BRANCH_NAME

      - name: Update front-end.json
        run: |
          VERSION="${{ steps.find-latest-tag.outputs.new_version }}"
          jq --arg v "$VERSION" '.stage = $v | .prod = $v' $FILE_PATH > tmp.json && mv tmp.json $FILE_PATH

      - name: Commit and push changes
        run: |
          VERSION="${{ steps.find-latest-tag.outputs.new_version }}"
          BRANCH_NAME="${{ env.BRANCH_NAME_PREFIX }}${{ steps.find-latest-tag.outputs.new_version }}"

          git add $FILE_PATH
          git commit -m "chore: update front-end.json to $VERSION"
          git push origin $BRANCH_NAME

      - name: Create PR in deploy repo
        uses: actions/github-script@v7
        env:
          DEPLOY_GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
        with:
          github-token: ${{ secrets.DEPLOY_GH_TOKEN }}
          script: |
            const version = "${{ steps.find-latest-tag.outputs.new_version }}";
            const branchName = `deploy-${version}`;
            const owner = 'newddda';
            const repo = 'deploy';

            const title = `Update front-end.json to ${version}`;
            const body = `This PR updates front-end.json with version ${version}.`;
            const base = 'main';
            const head = branchName;

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body,
            });

            core.setOutput("pr_url", pr.data.html_url);


      - name: Add deploy-conflict label on failure
        if: steps.find-latest-tag.outputs.tag_created == 'false'
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo, number } = context.issue;
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: number,
              labels: ['deploy-conflict']
            });
            console.log('Added deploy-conflict label due to cherry-pick failure');

